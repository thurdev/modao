appId: dev.modao.app
productName: Modão
# The window and the installer say "Modão"; the file on disk stays ASCII, because an
# accent in an executable name trips shortcuts, scripts and the odd antivirus.
executableName: Modao
directories:
  buildResources: build
  output: dist
files:
  # Only the three bundles the app actually runs. out/ also holds build
  # artefacts - the test bundle, the catalogue seed builder - which have no
  # business inside the installer.
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
extraResources:
  - from: resources/seed
    to: seed
asarUnpack:
  - "**/*.node"
  - "**/7zip-bin/**"
# Where the app looks for updates. electron-builder also writes latest.yml
# beside the installer from this, which is the file electron-updater reads.
publish:
  provider: github
  owner: thurdev
  repo: modao
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Modao-Setup-${version}.${ext}
nsis:
  # Shown on the first page of the installer, so nobody has to go looking for it.
  license: LICENSE
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
